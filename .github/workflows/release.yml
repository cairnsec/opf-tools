name: release

# Publishes to npm on a version tag, using npm trusted publishing.
#
# There is deliberately no NPM_TOKEN. Trusted publishing exchanges the
# GitHub OIDC token for a short-lived npm credential, so there is no
# long-lived secret in this repository to steal, and provenance is
# generated automatically.
#
# This requires a one-time setup on npmjs.com, under the package's
# Settings -> Trusted publisher:
#   organization or user: cairnsec
#   repository:           opf-tools
#   workflow filename:    release.yml
# The workflow filename is matched exactly. Renaming this file breaks
# publishing until the npm side is updated to match.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node >= 22.14.0 and npm >= 11.5.1.
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure npm is new enough for trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install
        run: npm install

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Tag must match the version being published
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          pkg=$(node -p "require('./package.json').version")
          # Accept both v0.1.1 and 0.1.1 as tag forms.
          tag=${TAG#v}
          if [ "$pkg" != "$tag" ]; then
            echo "tag '$TAG' does not match package.json version '$pkg'"
            exit 1
          fi
          echo "publishing $pkg"

      - name: Refuse to republish an existing version
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published; bump the version first"
            exit 1
          fi

      - name: Publish
        # No NODE_AUTH_TOKEN: the OIDC exchange supplies the credential,
        # and provenance is attached automatically.
        run: npm publish

      - name: Confirm it is live and attested
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          for i in $(seq 1 20); do
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is live"
              npm view "$name@$version" dist.attestations || \
                echo "note: no attestations reported yet, they can lag the publish"
              exit 0
            fi
            sleep 10
          done
          echo "published but not visible in the registry after 200s"
          exit 1
